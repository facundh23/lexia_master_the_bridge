name: lexia-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lexia}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lexia}']
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: lexia-chroma
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: 'false'
      ALLOW_RESET: 'true'

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: lexia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lexia_dev_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lexia_dev_secret_change_me}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lexia-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  langfuse-db:
    image: postgres:16-alpine
    container_name: lexia-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev_password
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse']
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:3
    container_name: lexia-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev_password@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse_nextauth_secret_replace_in_prod
      SALT: langfuse_salt_replace_in_prod_32chars_
      LANGFUSE_INIT_ORG_ID: lexia-org
      LANGFUSE_INIT_ORG_NAME: Lexia
      LANGFUSE_INIT_PROJECT_ID: lexia-core
      LANGFUSE_INIT_PROJECT_NAME: lexia-core
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: dev_pk_lexia_replace_in_prod
      LANGFUSE_INIT_PROJECT_SECRET_KEY: dev_sk_lexia_replace_in_prod
    ports:
      - '3001:3000'

volumes:
  postgres_data:
  chroma_data:
  minio_data:
  langfuse_db_data:
